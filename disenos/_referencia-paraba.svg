<style>
.i1{fill:#F1E9DA}.i2{fill:#C8344A}.i3{fill:#3B6E8F}.g{fill:#264A3B}
.l1{fill:none;stroke:#F1E9DA;stroke-linecap:round;stroke-linejoin:round}
.l2{fill:none;stroke:#C8344A;stroke-linecap:round;stroke-linejoin:round}
.l3{fill:none;stroke:#3B6E8F;stroke-linecap:round;stroke-linejoin:round}
.lg{fill:none;stroke:#264A3B;stroke-linecap:round;stroke-linejoin:round}
</style>
